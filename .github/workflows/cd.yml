name: CD - Deploy to AWS

on:
  workflow_run:
    workflows: ["CI - Build & Test"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: '1.9.5'

jobs:
  deploy-infrastructure:
    name: Deploy Infrastructure (Terraform)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::262232992721:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -var="key_pair_name=${{ vars.KEY_PAIR_NAME }}"

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -var="key_pair_name=${{ vars.KEY_PAIR_NAME }}" -auto-approve

  deploy-application:
    name: Deploy Application to EC2
    needs: deploy-infrastructure
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::262232992721:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Get EC2 Instance Public IP
        id: get-ip
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=TodoApp*" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_ID \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT

      - name: Get Database Password from Secrets Manager
        id: get-secret
        run: |
          SECRET_ARN=$(aws secretsmanager list-secrets \
            --filters Key=name,Values=DbSecret \
            --query "SecretList[0].ARN" --output text)
          DB_PASSWORD=$(aws secretsmanager get-secret-value \
            --secret-id $SECRET_ARN --query SecretString --output text | jq -r .password)
          echo "db_password=$DB_PASSWORD" >> $GITHUB_OUTPUT

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.get-ip.outputs.public_ip }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: ECR_REPOSITORY
          script: |
            # Fix ownership of app directory
            sudo chown -R ec2-user:ec2-user /opt/todo-app

            cd /opt/todo-app
            # Clone repo on first deploy
            if [ ! -d .git ]; then
              git clone https://github.com/hoanganh-p/todo-app-aws-ec2.git .
            else
              git pull origin main
            fi

            # Write password to file using printf (handles special chars)
            printf '%s\n' "${{ steps.get-secret.outputs.db_password }}" > /tmp/db_password.txt
            export DB_USER=todo_user
            export DB_NAME=todo_app_aws_ec2_db
            export DB_PASSWORD=$(cat /tmp/db_password.txt)
            export REACT_APP_API_URL=/api
            export ECR_REPOSITORY=${{ vars.ECR_REPOSITORY }}

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Wait for health checks
            sleep 10
            docker compose -f docker-compose.prod.yml ps

            # Health check
            curl -f http://localhost/ || exit 1
            curl -f http://localhost/api/tasks || exit 1

      - name: Post-deployment verification
        run: |
          sleep 5
          curl -f http://${{ steps.get-ip.outputs.public_ip }}/ || exit 1
          curl -f http://${{ steps.get-ip.outputs.public_ip }}/api/tasks || exit 1
          echo "Deployment successful!"